<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Archive Kütüphanesi</title>

    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#ffffff" media="(max-width: 639px)">
    <meta name="theme-color" content="#18181b" media="(min-width: 640px)">
    <link rel="apple-touch-icon" href="/icon.png?v=2">
    <link rel="stylesheet" href="/styles.css">

    <style>
        /* Animasyonlu Açılış Ekranı Tasarımı */
        #custom-splash {
            position: fixed;
            inset: 0;
            background-color: #ffffff;
            z-index: 99999;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.4s ease-out, visibility 0.4s ease-out;
            font-family: 'Courier New', Courier, monospace;
        }

        .splash-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }

        #splash-title {
            color: #18181b;
            font-weight: 800;
            font-size: 2.8rem;
            letter-spacing: 0.4rem;
            min-height: 3.5rem;
        }

        /* Fade-in (Yumuşak Belirme) Efekti */
        .fade-letter {
            opacity: 0;
            display: inline-block;
            animation: fadeInLetter 1s ease-out forwards;
        }

        @keyframes fadeInLetter {
            to { opacity: 1; }
        }

        #splash-subtitle {
            color: #52525b;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 0.1rem;
            min-height: 1.5rem;
        }

        /* Yanıp sönen siyah daktilo imleci */
        .cursor::after {
            content: '|';
            color: #18181b; 
            animation: blink 0.8s step-end infinite;
            margin-left: 4px;
        }

        @keyframes blink {
            from, to { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Kaybolma efekti */
        .fade-out {
            opacity: 0;
            visibility: hidden;
        }
    </style>
<script src="https://unpkg.com/@zxing/library@latest"></script>
<script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body class="bg-white sm:bg-zinc-100 flex justify-center text-zinc-900 overflow-x-hidden">
    
    <!-- Özel Açılış Ekranı -->
    <div id="custom-splash">
        <div class="splash-content">
            <div id="splash-title"></div>
            <div id="splash-subtitle"></div>
        </div>
    </div>

    <div id="root" class="w-full h-full sm:max-w-md bg-white sm:shadow-2xl relative overflow-hidden flex flex-col h-[100dvh]"></div>

    <!-- Animasyon Mantığı -->
    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const splash = document.getElementById('custom-splash');
        const titleEl = document.getElementById('splash-title');
        const subtitleEl = document.getElementById('splash-subtitle');
        const titleText = "Archive";
        const subtitleText = "Kütüphanen artık cebinde...";

        let skipped = false;
        const skipSplash = () => {
            if (skipped) return;
            skipped = true;
            splash.classList.add('fade-out');
            setTimeout(() => splash.remove(), 400);
        };
        splash.addEventListener('click', skipSplash);
        splash.addEventListener('touchstart', skipSplash, { passive: true });

        const typeText = async (element, text, minSpeed, maxSpeed) => {
            element.classList.add('cursor');
            for (let i = 0; i < text.length; i++) {
                if (skipped) return;
                element.innerHTML = text.substring(0, i + 1);
                const delay = Math.random() * (maxSpeed - minSpeed) + minSpeed;
                await new Promise(r => setTimeout(r, delay));
            }
        };

        const runAnimation = async () => {
            await new Promise(r => setTimeout(r, 1000));
            if (skipped) return;

            titleEl.innerHTML = '';
            for (let i = 0; i < titleText.length; i++) {
                const span = document.createElement('span');
                span.textContent = titleText[i];
                span.className = 'fade-letter';
                span.style.animationDelay = `${i * 0.15}s`;
                titleEl.appendChild(span);
            }

            await new Promise(r => setTimeout(r, 1500));
            if (skipped) return;

            await typeText(subtitleEl, subtitleText, 50, 80);
            if (skipped) return;

            await new Promise(r => setTimeout(r, 600));
            if (skipped) return;

            splash.classList.add('fade-out');
            setTimeout(() => splash.remove(), 500);
        };

        runAnimation();
    });
    </script>

    <script type="module" src="/src/main.jsx"></script>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js')
            .then(reg => console.log('Service Worker kayıtlı:', reg.scope))
            .catch(err => console.log('Service Worker hata:', err));
        });
      }
    </script>
</body>
</html>
